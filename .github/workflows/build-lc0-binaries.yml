name: Build lc0 Binaries

on:
  workflow_dispatch:
    inputs:
      lc0_tag:
        type: string
        default: v0.32.1
        description: lc0 repo tag
        required: true
      create_pull_request:
        type: boolean
        description: Create PR with new binaries

jobs:
  linux_x86-64:
    runs-on: ubuntu-latest
    env:
      binary: lc0_x86-64_linux
    steps:
      - name: Clone lc0 @ tag:${{ inputs.lc0_tag }}
        uses: actions/checkout@master
        with:
          repository: LeelaChessZero/lc0
          ref: refs/tags/${{ inputs.lc0_tag }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      # blas=true with openblas/mkl/dnnl all disabled falls back to the
      # header-only bundled Eigen backend - no runtime BLAS dependency
      # on the end-user's machine.
      - name: Build lc0 (Eigen backend)
        run: |
          ./build.sh -Ddefault_library=static -Dblas=true -Dopenblas=false -Dmkl=false -Ddnnl=false -Dopencl=false -Dcudnn=false -Donednn=false -Donnx=false -Dgtest=false
          strip build/release/lc0
          cp build/release/lc0 ${{ env.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: dir-${{ env.binary }}
          path: ${{ env.binary }}

  windows_x86-64:
    runs-on: windows-2022
    env:
      binary: lc0_x86-64_windows
    steps:
      - name: Clone lc0 @ tag:${{ inputs.lc0_tag }}
        uses: actions/checkout@master
        with:
          repository: LeelaChessZero/lc0
          ref: refs/tags/${{ inputs.lc0_tag }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          pip install meson ninja

      # lc0's build.cmd is an interactive, hand-edited helper (hardcoded CUDA
      # paths, a `pause`) rather than a flag-driven CLI script like build.sh -
      # call meson/ninja directly instead, same as the Linux/macOS jobs, after
      # loading the MSVC dev environment for cl.exe/link.exe.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # blas=true with openblas/mkl/dnnl all disabled falls back to the
      # header-only bundled Eigen backend - no runtime BLAS dependency
      # on the end-user's machine.
      - name: Build lc0 (Eigen backend)
        run: |
          meson setup build/release --backend ninja --buildtype release -Ddefault_library=static -Dblas=true -Dopenblas=false -Dmkl=false -Ddnnl=false -Dopencl=false -Dcudnn=false -Donednn=false -Donnx=false -Dgtest=false
          meson compile -C build/release
          copy build\release\lc0.exe ${{ env.binary }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dir-${{ env.binary }}
          path: ${{ env.binary }}.exe

  # No macOS x86-64 job: GitHub's hosted macOS runners are arm64-only under
  # free-tier labels now that Apple has discontinued Intel Macs. lc0 is only
  # vendored for macOS arm64 (see MaiaOpponent.get_binary_path()); Rosetta 2
  # covers the remaining Intel Macs still in use.
  macos_arm64:
    runs-on: macos-15
    env:
      binary: lc0_arm64_macos
    steps:
      - name: Clone lc0 @ tag:${{ inputs.lc0_tag }}
        uses: actions/checkout@master
        with:
          repository: LeelaChessZero/lc0
          ref: refs/tags/${{ inputs.lc0_tag }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install meson ninja

      # Accelerate is a system framework built into macOS - no extra install needed.
      - name: Build lc0 (Accelerate-backed BLAS)
        run: |
          ./build.sh -Ddefault_library=static -Dblas=true -Dopenblas=false -Dmkl=false -Ddnnl=false -Dopencl=false -Dcudnn=false -Donednn=false -Donnx=false -Dgtest=false
          strip build/release/lc0
          cp build/release/lc0 ${{ env.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: dir-${{ env.binary }}
          path: ${{ env.binary }}

  create_pr:
    if: github.event.inputs.create_pull_request == 'true'
    runs-on: ubuntu-latest
    needs:
      - linux_x86-64
      - windows_x86-64
      - macos_arm64
    env:
      COMMIT_PATH: src/cli_chess/modules/engine/binaries/lc0
      BRANCH_NAME: workflow/update-lc0-binaries-${{github.run_id}}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone cli-chess
        uses: actions/checkout@v3

      - name: Download lc0 artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          path: ${{ env.COMMIT_PATH }}

      - name: Extract and make binaries executable
        run: |
          find dir-* -type f -exec mv -f '{}' ./ ';'
          chmod +x lc0_x86-64_linux lc0_arm64_macos
          rm -rf dir-*
          ls -la
        working-directory: ${{ env.COMMIT_PATH }}

      - name: Create pull request
        run: |
          cd $COMMIT_PATH
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b $BRANCH_NAME
          git add lc0_*
          git commit -m "Update lc0 binaries"
          git push -u origin $BRANCH_NAME
          gh pr create -B master -H $BRANCH_NAME \
          --title "Update lc0 binaries using tag@${{ inputs.lc0_tag }}" \
          --body "Generated from GitHub workflow [run #${{github.run_id}}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
